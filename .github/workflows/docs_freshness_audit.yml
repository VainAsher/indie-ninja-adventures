name: Docs Freshness Audit

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

jobs:
  docs-freshness-audit:
    name: Docs Freshness Audit
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate docs freshness report
        run: |
          python tools/check_docs_freshness.py --emit-report

      - name: Upload docs freshness report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-freshness-audit-${{ github.run_id }}
          path: docs/reports/docs_freshness_report.md
