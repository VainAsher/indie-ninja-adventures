name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.8.0 && git push origin v0.8.0
#
# Builds:
#   - ninja_dash.exe           (production game, onefile)
#   - ninja_dash_launcher.exe  (standalone launcher, onefile)
# Then creates a GitHub release with both exes + SHA256 checksum,
# and dispatches a notification to the launcher repo.
#
# Required secret: CROSS_REPO_PAT
#   A classic Personal Access Token with `repo` scope.
#   Used to dispatch `game-release` to VainAsher/indie-ninja-launcher.
#   Create at: https://github.com/settings/tokens
#   Add at:    Settings → Secrets → Actions → New repository secret

on:
  push:
    tags:
      - 'v0.*.*'
  workflow_dispatch:

permissions:
  contents: write   # required to create releases and upload assets

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate tag lane and version metadata
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          python tools/check_version_sync.py --tag "$TAG"

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Build server + client JARs
        working-directory: java
        shell: bash
        run: gradle :server:test :server:shadowJar :client:shadowJar --no-daemon --stacktrace

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install runtime dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
          pip install pyinstaller

      - name: Run Python tests
        run: |
          python run_tests.py
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy

      - name: Build docs archive ZIP snapshot
        shell: pwsh
        run: |
          $out = python tools/build_docs_archive_zip.py
          $out | ForEach-Object { Write-Host $_ }
          $zipLine = ($out | Select-String '^archive_zip=' | Select-Object -First 1).Line
          if (-not $zipLine) { Write-Error "Missing archive_zip output"; exit 1 }
          $zipPath = $zipLine.Split('=')[1]
          if (-not (Test-Path $zipPath)) { Write-Error "Docs archive zip not found: $zipPath"; exit 1 }
          echo "DOCS_ARCHIVE_ZIP=$zipPath" >> $env:GITHUB_ENV

      # Run pyinstaller directly (not via build.py) so both exes land in
      # build/dist/ without the cleanup step wiping the first one.
      - name: Build game exe (production)
        working-directory: build
        run: pyinstaller --clean ninja_dash_production.spec

      - name: Build launcher exe
        working-directory: build
        run: pyinstaller --clean ninja_dash_launcher.spec

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash build\dist\ninja_dash.exe -Algorithm SHA256).Hash.ToLower()
          "${hash}  ninja_dash.exe" | Out-File -FilePath build\dist\ninja_dash.exe.sha256 -Encoding ascii -NoNewline

      - name: Locate JARs
        shell: pwsh
        run: |
          $server = Get-ChildItem -Path "java\server\build\libs" -Filter "*-all.jar" | Select-Object -First 1
          if (-not $server) { Write-Error "Server JAR not found"; exit 1 }
          echo "SERVER_JAR=$($server.FullName)" >> $env:GITHUB_ENV

          $client = Get-ChildItem -Path "java\client\build\libs" -Filter "*-all.jar" | Select-Object -First 1
          if (-not $client) { Write-Error "Client JAR not found"; exit 1 }
          echo "CLIENT_JAR=$($client.FullName)" >> $env:GITHUB_ENV

          Write-Host "Server JAR: $($server.FullName)"
          Write-Host "Client JAR: $($client.FullName)"

      - name: Verify expected assets exist
        shell: pwsh
        run: |
          @(
            "build\dist\ninja_dash.exe",
            "build\dist\ninja_dash_launcher.exe",
            "build\dist\ninja_dash.exe.sha256",
            "$env:DOCS_ARCHIVE_ZIP"
          ) | ForEach-Object {
            if (-not (Test-Path $_)) {
              Write-Error "Missing expected asset: $_"
              exit 1
            }
          }
          Write-Host "All assets present."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Delete existing release for this tag if it was created manually (e.g. JAR-only)
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
          gh release create "${{ github.ref_name }}" \
            --title "Indie Ninja Adventures ${{ github.ref_name }}" \
            --generate-notes \
            "build/dist/ninja_dash.exe" \
            "build/dist/ninja_dash.exe.sha256" \
            "build/dist/ninja_dash_launcher.exe" \
            "$DOCS_ARCHIVE_ZIP" \
            "$SERVER_JAR" \
            "$CLIENT_JAR"

      - name: Notify launcher repo of new game release
        # Requires CROSS_REPO_PAT secret — step is skipped gracefully if not configured
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          repository: VainAsher/indie-ninja-launcher
          event-type: game-release
          client-payload: |
            {
              "version": "${{ github.ref_name }}",
              "release_url": "https://github.com/VainAsher/indie-ninja-adventures/releases/tag/${{ github.ref_name }}"
            }
