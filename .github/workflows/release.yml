name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.12.0 && git push origin v0.12.0
#
# Builds Java release assets:
#   - ninja-server-all.jar
#   - ninja-client-all.jar
#   - docs archive ZIP snapshot

on:
  push:
    tags:
      - "v0.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (for manual runs), e.g. v0.11.72"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release (Java Lane)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (repo tooling only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate tag lane and version metadata
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          python tools/check_version_sync.py --tag "$TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Test and package Java server/client
        working-directory: java
        shell: bash
        run: |
          gradle :server:test :client:test --no-daemon --stacktrace
          gradle :server:shadowJar :client:shadowJar --no-daemon --stacktrace

      - name: Build docs archive ZIP snapshot
        shell: pwsh
        run: |
          $out = python tools/build_docs_archive_zip.py
          $out | ForEach-Object { Write-Host $_ }
          $zipLine = ($out | Select-String '^archive_zip=' | Select-Object -First 1).Line
          if (-not $zipLine) { Write-Error "Missing archive_zip output"; exit 1 }
          $zipPath = $zipLine.Split('=')[1]
          if (-not (Test-Path $zipPath)) { Write-Error "Docs archive zip not found: $zipPath"; exit 1 }
          echo "DOCS_ARCHIVE_ZIP=$zipPath" >> $env:GITHUB_ENV

      - name: Locate JARs
        shell: pwsh
        run: |
          $server = Get-ChildItem -Path "java\server\build\libs" -Filter "*-all.jar" | Select-Object -First 1
          if (-not $server) { Write-Error "Server JAR not found"; exit 1 }
          echo "SERVER_JAR=$($server.FullName)" >> $env:GITHUB_ENV

          $client = Get-ChildItem -Path "java\client\build\libs" -Filter "*-all.jar" | Select-Object -First 1
          if (-not $client) { Write-Error "Client JAR not found"; exit 1 }
          echo "CLIENT_JAR=$($client.FullName)" >> $env:GITHUB_ENV

          Write-Host "Server JAR: $($server.FullName)"
          Write-Host "Client JAR: $($client.FullName)"

      - name: Verify expected assets exist
        shell: pwsh
        run: |
          @(
            "$env:DOCS_ARCHIVE_ZIP",
            "$env:SERVER_JAR",
            "$env:CLIENT_JAR"
          ) | ForEach-Object {
            if (-not (Test-Path $_)) {
              Write-Error "Missing expected asset: $_"
              exit 1
            }
          }
          Write-Host "All assets present."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Delete existing release for this tag if it was created manually
          gh release delete "$RELEASE_TAG" --yes 2>/dev/null || true
          gh release create "$RELEASE_TAG" \
            --title "Indie Ninja Adventures $RELEASE_TAG" \
            --generate-notes \
            "$DOCS_ARCHIVE_ZIP" \
            "$SERVER_JAR" \
            "$CLIENT_JAR"

      - name: Notify launcher repo of new game release
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          repository: VainAsher/indie-ninja-launcher
          event-type: game-release
          client-payload: |
            {
              "version": "${{ env.RELEASE_TAG }}",
              "release_url": "https://github.com/VainAsher/indie-ninja-adventures/releases/tag/${{ env.RELEASE_TAG }}"
            }
