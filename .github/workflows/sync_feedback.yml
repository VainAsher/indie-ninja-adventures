name: Weekly Feedback Sync

# Runs every Monday at 9am UTC, or manually via workflow_dispatch.
# Fetches open issues from the public feedback repo and posts a
# triage summary as a comment on the designated intake tracking issue.
#
# Required secret: CROSS_REPO_PAT
#   Classic PAT with `repo` scope (read access to indie-ninja-feedback).
#
# Setup:
#   1. Create an issue in this repo titled "Weekly Intake Tracking"
#   2. Set INTAKE_ISSUE_NUMBER below to that issue's number
#   3. Add CROSS_REPO_PAT secret

on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 9am UTC
  workflow_dispatch:      # Also triggerable manually

env:
  FEEDBACK_REPO: VainAsher/indie-ninja-feedback
  GAME_REPO: VainAsher/indie-ninja-adventures
  INTAKE_ISSUE_NUMBER: 1   # UPDATE: set to your intake tracking issue number

jobs:
  sync-feedback:
    name: Sync Feedback Issues
    runs-on: ubuntu-latest

    steps:
      - name: Fetch open feedback issues and post intake summary
        uses: actions/github-script@v7
        env:
          CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
        with:
          github-token: ${{ env.CROSS_REPO_PAT }}
          script: |
            const feedbackRepo = process.env.FEEDBACK_REPO;
            const [owner, repo] = feedbackRepo.split('/');

            // Fetch open issues from feedback repo (last 30 days)
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 7);

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              sort: 'created',
              direction: 'desc',
              per_page: 100,
            });

            const newIssues = issues.filter(i => new Date(i.created_at) >= cutoff);
            const allOpen = issues.length;

            // Build summary by label
            const byLabel = {};
            for (const issue of newIssues) {
              for (const label of issue.labels) {
                if (!byLabel[label.name]) byLabel[label.name] = [];
                byLabel[label.name].push(issue);
              }
            }

            // Format summary
            const lines = [
              `## Weekly Intake — ${new Date().toISOString().split('T')[0]}`,
              '',
              `**New this week**: ${newIssues.length} | **Total open**: ${allOpen}`,
              '',
            ];

            const labelOrder = ['bug', 'feature', 'feedback', 'performance', 'urgent'];
            for (const label of labelOrder) {
              const group = byLabel[label] || [];
              if (group.length === 0) continue;
              lines.push(`### ${label} (${group.length})`);
              for (const issue of group) {
                lines.push(`- [#${issue.number}](${issue.html_url}) — ${issue.title}`);
              }
              lines.push('');
            }

            // Handle unlabelled
            const labelled = new Set(newIssues.flatMap(i => i.labels.map(l => l.name)));
            const unlabelled = newIssues.filter(i => i.labels.length === 0);
            if (unlabelled.length > 0) {
              lines.push(`### unlabelled (${unlabelled.length})`);
              for (const issue of unlabelled) {
                lines.push(`- [#${issue.number}](${issue.html_url}) — ${issue.title}`);
              }
              lines.push('');
            }

            lines.push('---');
            lines.push('_Auto-generated by sync_feedback.yml. Triage these in the pipeline repo._');

            const body = lines.join('\n');

            // Post as comment on intake tracking issue
            const [gameOwner, gameRepo] = process.env.GAME_REPO.split('/');
            await github.rest.issues.createComment({
              owner: gameOwner,
              repo: gameRepo,
              issue_number: parseInt(process.env.INTAKE_ISSUE_NUMBER),
              body,
            });

            console.log(`Posted intake summary: ${newIssues.length} new issues, ${allOpen} total open.`);
