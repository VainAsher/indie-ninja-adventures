name: CI

on:
  push:
    branches: [ master, develop, feature/** ]
  pull_request:
    branches: [ master, develop ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff (critical errors only)
        run: |
          # Only fail on critical errors (undefined names)
          # Allow minor warnings (unused vars, import order, etc.)
          ruff check . --select F821,F822,F823 --output-format=github

      - name: Check formatting with black
        run: |
          black --check .

      - name: Type check with mypy
        run: |
          mypy core/ systems/ entities/ --ignore-missing-imports
        continue-on-error: true  # Gradual typing — core modules 98% coverage

      - name: Run tests
        run: |
          python run_tests.py
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test_baseline.txt
            quality_baseline_*.txt

  java-build:
    name: Java Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Build server JAR + run tests
        working-directory: java
        shell: bash
        run: gradle :server:test :server:shadowJar :client:shadowJar --no-daemon --stacktrace

      - name: Upload server JAR
        uses: actions/upload-artifact@v4
        with:
          name: ninja-server-jar
          path: java/server/build/libs/*-all.jar
          if-no-files-found: error

      - name: Upload client JAR
        uses: actions/upload-artifact@v4
        with:
          name: ninja-client-jar
          path: java/client/build/libs/*-all.jar
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: java/server/build/reports/tests/

  lint-strict:
    name: Linting (Informational)
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy

      - name: Ruff statistics
        run: |
          ruff check . --statistics || echo "Minor warnings present (acceptable)"
          exit 0

      - name: Black statistics
        run: |
          black --check . 2>&1 | Select-String "would reformat" | Measure-Object -Line || echo "No formatting issues"
          exit 0

      - name: MyPy statistics
        run: |
          mypy core/ systems/ entities/ --ignore-missing-imports --no-error-summary 2>&1 | Select-String "error:" | Measure-Object -Line || echo "No type errors"
          exit 0
