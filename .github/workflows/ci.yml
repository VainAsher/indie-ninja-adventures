name: CI

on:
  push:
    branches: [ master, feature/** ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check . --output-format=github
        continue-on-error: true  # Don't fail yet - establishing baseline

      - name: Check formatting with black
        run: |
          black --check --diff .
        continue-on-error: true  # Don't fail yet - establishing baseline

      - name: Type check with mypy
        run: |
          mypy core/ systems/ entities/ --ignore-missing-imports
        continue-on-error: true  # Don't fail yet - establishing baseline

      - name: Run tests
        run: |
          python run_tests.py
        env:
          SDL_VIDEODRIVER: dummy  # Headless mode for pygame
          SDL_AUDIODRIVER: dummy

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test_baseline.txt
            quality_baseline_*.txt

  lint-strict:
    name: Linting (Strict Mode - Informational)
    runs-on: windows-latest
    continue-on-error: true  # This job is informational only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy

      - name: Ruff statistics
        run: ruff check . --statistics

      - name: Black statistics
        run: |
          black --check . 2>&1 | Select-String "would reformat" | Measure-Object -Line

      - name: MyPy statistics
        run: mypy core/ systems/ entities/ --ignore-missing-imports --no-error-summary 2>&1 | Select-String "error:" | Measure-Object -Line
