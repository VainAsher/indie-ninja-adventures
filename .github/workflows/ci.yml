name: CI

on:
  push:
    branches: [ master, develop, feature/**, hotfix/** ]
  pull_request:
    branches: [ master, develop ]

jobs:
  docs-freshness:
    name: Docs Freshness (Soft Gate)
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run docs freshness check (warning-only)
        run: |
          python tools/check_docs_freshness.py --emit-report

      - name: Upload docs freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-freshness-report
          path: docs/reports/docs_freshness_report.md

  java-build:
    name: Java Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Set up Python 3.11 (repo tooling only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate version metadata sync
        run: |
          python tools/check_version_sync.py

      - name: Run Java regression suites
        working-directory: java
        shell: bash
        run: gradle :server:test :client:test --no-daemon --stacktrace

      - name: Build server + client JARs
        working-directory: java
        shell: bash
        run: gradle :server:shadowJar :client:shadowJar --no-daemon --stacktrace

      - name: Upload server JAR
        uses: actions/upload-artifact@v4
        with:
          name: ninja-server-jar
          path: java/server/build/libs/*-all.jar
          if-no-files-found: error

      - name: Upload client JAR
        uses: actions/upload-artifact@v4
        with:
          name: ninja-client-jar
          path: java/client/build/libs/*-all.jar
          if-no-files-found: error

      - name: Run asset pipeline + animation manifest validation
        shell: bash
        run: |
          python tools/asset_pipeline.py --root assets --out assets/asset_manifest.json
          python tools/validate_animation_manifest.py --manifest assets/animations/manifest.json

      - name: Upload asset pipeline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-manifest
          path: assets/asset_manifest.json

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            java/server/build/reports/tests/
            java/client/build/reports/tests/
