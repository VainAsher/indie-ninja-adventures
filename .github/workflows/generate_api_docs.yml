name: Generate API Docs

# Manually triggered — generates HTML API reference from docstrings with pdoc.
# Output is uploaded as a GitHub Actions artifact (not committed or deployed).
#
# To use: Actions → Generate API Docs → Run workflow
# Download the artifact: api-docs-<run-id>.zip

on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate API Reference
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
          pip install pdoc

      - name: Generate API docs
        run: |
          pdoc game/ systems/ network/ core/ entities/ mechanics/ -o docs/dev/api/
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy

      - name: Upload API docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs-${{ github.run_id }}
          path: docs/dev/api/
          retention-days: 30
