# Logging Configuration for Vain Asher Gaming's: Indie Ninja Adventures
#
# This file defines logging levels and output formats for different modules.
#
# Log Levels (from least to most severe):
#   DEBUG   - Detailed diagnostic information
#   INFO    - General informational messages
#   WARNING - Warning messages for potentially problematic situations
#   ERROR   - Error messages for serious problems
#
# To use this configuration, pass it to GameLogger:
#   logger = GameLogger(config_path=Path("config/logging.yaml"))

version: 1
disable_existing_loggers: false

formatters:
  # Console formatter (concise, easier to read during gameplay)
  standard:
    format: '%(asctime)s [%(levelname)8s] %(name)30s | %(message)s'
    datefmt: '%H:%M:%S'

  # File formatter (detailed, includes line numbers for debugging)
  detailed:
    format: '%(asctime)s [%(levelname)s] %(name)s:%(lineno)d | %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  # Console output (stdout)
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  # Rotating file handler (10MB per file, 3 backups = 30MB total)
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: user_data/logs/ninja_dash.log  # Replaced at runtime with session file
    maxBytes: 10485760  # 10MB
    backupCount: 3
    encoding: utf-8

# Module-specific log levels
loggers:
  # Core systems
  ninja_dash.core.event_bus:
    level: INFO

  ninja_dash.core.clock:
    level: INFO

  ninja_dash.core.state:
    level: INFO

  # Game systems
  ninja_dash.systems.physics:
    level: INFO

  ninja_dash.systems.collision:
    level: DEBUG  # More verbose for debugging collision issues

  ninja_dash.systems.input:
    level: INFO

  ninja_dash.systems.pickup:
    level: INFO

  # Player mechanics (verbose for debugging gameplay)
  ninja_dash.mechanics:
    level: DEBUG

  ninja_dash.mechanics.jump:
    level: DEBUG

  ninja_dash.mechanics.dash:
    level: DEBUG

  ninja_dash.mechanics.movement:
    level: DEBUG

  ninja_dash.mechanics.crouch:
    level: DEBUG

  ninja_dash.mechanics.wall_slide:
    level: DEBUG

  ninja_dash.mechanics.health:
    level: INFO

  # Rendering (less verbose - only warnings and errors)
  ninja_dash.rendering:
    level: WARNING

  # Network systems
  ninja_dash.network:
    level: INFO

  ninja_dash.network.commands:
    level: DEBUG

  ninja_dash.network.snapshot:
    level: INFO

  # Game logic
  ninja_dash.game:
    level: INFO

# Root logger configuration
root:
  level: INFO
  handlers: [console, file]
