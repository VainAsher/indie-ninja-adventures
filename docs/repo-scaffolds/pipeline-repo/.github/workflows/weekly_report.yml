name: Weekly Dev Report

# Every Friday at 8am UTC — generates a weekly summary issue.
# Shows tasks closed this week, tasks still open, and blocked items.

on:
  schedule:
    - cron: '0 8 * * 5'  # Friday 8am UTC
  workflow_dispatch:

jobs:
  weekly-report:
    name: Generate Weekly Report
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Generate and post weekly report
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const weekAgo = new Date(now);
            weekAgo.setDate(weekAgo.getDate() - 7);

            const isoWeekAgo = weekAgo.toISOString();
            const dateStr = now.toISOString().split('T')[0];

            // Fetch closed issues (closed this week)
            const closedIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              sort: 'updated',
              direction: 'desc',
              per_page: 50,
            });

            const closedThisWeek = closedIssues.filter(i =>
              new Date(i.closed_at) >= weekAgo
            );

            // Fetch open issues
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const blocked = openIssues.filter(i =>
              i.labels.some(l => l.name === 'blocked')
            );

            const inProgress = openIssues.filter(i =>
              i.labels.some(l => l.name === 'in-progress')
            );

            // Build report
            const lines = [
              `## Weekly Dev Report — Week of ${dateStr}`,
              '',
              `**Closed this week**: ${closedThisWeek.length} | **Open**: ${openIssues.length} | **Blocked**: ${blocked.length}`,
              '',
            ];

            if (closedThisWeek.length > 0) {
              lines.push('### Done This Week');
              for (const issue of closedThisWeek) {
                lines.push(`- [#${issue.number}](${issue.html_url}) — ${issue.title}`);
              }
              lines.push('');
            }

            if (inProgress.length > 0) {
              lines.push('### In Progress');
              for (const issue of inProgress) {
                lines.push(`- [#${issue.number}](${issue.html_url}) — ${issue.title}`);
              }
              lines.push('');
            }

            if (blocked.length > 0) {
              lines.push('### Blocked');
              for (const issue of blocked) {
                lines.push(`- [#${issue.number}](${issue.html_url}) — ${issue.title}`);
              }
              lines.push('');
            }

            lines.push('---');
            lines.push('_Auto-generated by weekly_report.yml_');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly Report — ${dateStr}`,
              body: lines.join('\n'),
              labels: ['report'],
            });
