name: Feedback Intake Sync

# Runs every Monday at 9am UTC, or manually via workflow_dispatch.
# Pulls open issues from the feedback repo and posts a summary comment
# to a tracking issue in this pipeline repo.
#
# Required secret: CROSS_REPO_PAT (classic PAT with repo scope)

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

env:
  FEEDBACK_REPO: VainAsher/indie-ninja-feedback
  INTAKE_ISSUE_NUMBER: 2  # Intake tracking issue in indie-ninja-pipeline

jobs:
  sync-intake:
    name: Sync feedback intake summary
    runs-on: ubuntu-latest

    steps:
      - name: Fetch feedback issues and post summary
        uses: actions/github-script@v7
        env:
          CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
        with:
          github-token: ${{ env.CROSS_REPO_PAT }}
          script: |
            const [feedbackOwner, feedbackRepo] = process.env.FEEDBACK_REPO.split('/');
            const intakeIssueNumber = parseInt(process.env.INTAKE_ISSUE_NUMBER, 10);

            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 7);

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: feedbackOwner,
              repo: feedbackRepo,
              state: 'open',
              sort: 'created',
              direction: 'desc',
              per_page: 100,
            });

            const newIssues = issues.filter((issue) => new Date(issue.created_at) >= cutoff);
            const byLabel = {};

            for (const issue of newIssues) {
              if (!issue.labels || issue.labels.length === 0) {
                byLabel.unlabelled = byLabel.unlabelled || [];
                byLabel.unlabelled.push(issue);
                continue;
              }
              for (const label of issue.labels) {
                const name = label.name;
                byLabel[name] = byLabel[name] || [];
                byLabel[name].push(issue);
              }
            }

            const lines = [];
            lines.push(`## Weekly Intake - ${new Date().toISOString().split('T')[0]}`);
            lines.push('');
            lines.push(`**New this week**: ${newIssues.length} | **Total open**: ${issues.length}`);
            lines.push('');

            const labelOrder = ['bug', 'feature', 'feedback', 'performance', 'urgent', 'unlabelled'];
            for (const label of labelOrder) {
              const group = byLabel[label] || [];
              if (group.length === 0) continue;
              lines.push(`### ${label} (${group.length})`);
              for (const issue of group) {
                lines.push(`- [#${issue.number}](${issue.html_url}) - ${issue.title}`);
              }
              lines.push('');
            }

            lines.push('---');
            lines.push('_Auto-generated by feedback_intake_sync.yml_');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: intakeIssueNumber,
              body: lines.join('\n'),
            });

            core.info(`Posted intake summary with ${newIssues.length} new issue(s).`);
